<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Title Tag</title>
		<style>
			table {
				margin: auto;
			}
			.highlight {
				background-color: yellow;
			}
		</style>
	</head>
	<body>
		<table border="5">
			<tr>
				<th>국어</th>
				<th>영어</th>
				<th>수학</th>
			</tr>
			
			<tr>
				<th>100</th>
				<th>90</th>
				<th>80</th>
			</tr>
		</table>
		
		<br>		
		<table border="5">
			<tr>
				<th>국어</th>
				<th>영어</th>
				<th>수학</th>
			</tr>
			<tr>
				<td>100</td>
				<td>90</td>
				<td>80</td>
			</tr>
			<tr>
				<td colspan="2">평균</td>
				<td>90</td>
			</tr>
		</table>
		
		<br>
		
		<table border="5">
			<tr>
				<th rowspan="3">홍길동</th>
				<th>국어</th>
				<th>영어</th>
				<th>수학</th>
			</tr>
			<tr>
				<th>100</th>
				<th>90</th>
				<th>80</th>
			</tr>
			
			<tr>
				<td colspan="2">평균</td>
				<td>90</td>
			</tr>
		</table>
		<br>
		
		<table border="5">
			<tr>
				<th  align="center">이름</th>
				<th  align="center">국어</th>
				<th  align="center">영어</th>
				<th  align="center">수학</th>
			</tr>
			<tr>
				<th rowspan="2"  align="center">홍길동</th>
				<th  align="center">100</th>
				<th  align="center">90</th>
				<th align="center">80</th>
			</tr>
			<tr>
				<td colspan="2" align="center">평균</td>
				<td align="center">90</td>
			</tr>
		</table>
		
		
	</body>
</html>

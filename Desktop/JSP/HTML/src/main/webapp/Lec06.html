<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<style>
		body {
			font-family: Arial, sans-serif;
		}

		form {
			margin: 20px;
			display: table;
		}

		label {
			margin-bottom: 10px;
			display: table-row;
		}

		label span {
			display: table-cell;
			padding-right: 10px;
			text-align: right;
		}

		input, select {
			margin-bottom: 10px;
			display: table-cell;
		}

		textarea {
			vertical-align: middle;
			display: table-cell;
		}

		select {
			vertical-align: middle;
		}

		input[type="file"] {
			display: none; 
		}

		.custom-file-upload {
			display: inline-block;
			padding: 6px 12px;
			cursor: pointer;
			background-color: #4CAF50;
			color: white;
			border: none;
			border-radius: 4px;
		}

		label, input[type="radio"], input[type="checkbox"], select, textarea {
			margin-bottom: 10px;
		}
	</style>
</head>
<body>
	<form action="#" method="get">
		<label><span>이름 :</span> <input type="text" name="userName"></label> <br>
		<label><span>아이디 :</span> <input type="text" name="userId"></label> <br>
		<label><span>비밀번호 :</span> <input type="password" name="userPw"></label> <br>
		<label>
			<span>연락처 :</span>
			<input type="text" name="phone1" size="5"> -
			<input type="text" name="phone2" size="5"> -
			<input type="text" name="phone3" size="5">
		</label> <br>
		<label>
			<span>사진 :</span>
			<input type="file" name="picture" id="fileInput" style="display:none;">
			<label for="fileInput" class="custom-file-upload">사진 선택</label>
		</label> <br>
		<label>
			<span>성별 구분 :</span>
			<input type="radio" name="gender" value="man" checked="checked"> 남,
			<input type="radio" name="gender" value="woman"> 여
		</label> <br>
		<label>
			<span>사용언어 :</span>
			<input type="checkbox" name="lang" value="kor" checked="checked"> 한글
			<input type="checkbox" name="lang" value="eng"> 영어
			<input type="checkbox" name="lang" value="jpn"> 일어
			<input type="checkbox" name="lang" value="chn"> 중어
		</label> <br>
		<label><span>자기소개 :</span> <textarea rows="5" cols="20" name="introduce">간단하게 입력하세요.</textarea></label> <br>
		<label><span>국적 :</span>
			<select name="nationality">
				<option>Korea</option>
				<option>USA</option>
				<option>Japan</option>
				<option>China</option>
			</select>
		</label> <br>
		<label><span>좋아하는 음식 :</span>
			<select multiple="multiple" name="food">
				<option>김치</option>
				<option>불고기</option>
				<option>파전</option>
				<option>비빔밥</option>
			</select>
		</label> <br>
		<input type="submit" name="order" value="OK"> <br>
	</form>
</body>
</html>

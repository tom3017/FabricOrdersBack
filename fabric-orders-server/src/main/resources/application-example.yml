server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fabric_orders
    username: your_database_user
    password: your_database_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  mail:
    gmail:
      username: your-gmail@example.com
      password: your-gmail-password
    naver:
      username: your-naver@example.com
      password: your-naver-password

security:
  jwt:
    secret: replace-with-a-secure-random-secret-of-at-least-32-characters
    expiration-ms: 86400000

cors:
  allowed-origin-patterns: http://localhost:3000

file:
  upload-dir: uploads/profile
